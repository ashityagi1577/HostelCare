<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – HostelCare Portal</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      background: white;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h2 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #1e1b4b;
      margin-top: 0.5rem;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 0.92rem;
    }
    .role-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 0.35rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.75rem;
      gap: 0.25rem;
    }
    .role-tab {
      flex: 1;
      padding: 0.6rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
    }
    .role-tab.active {
      background: white;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand">
        <span class="brand-icon">🏠</span>
        <span>HostelCare</span>
      </a>
      <ul class="nav-links" id="navbar-links">
        <!-- Rendered by auth.js -->
      </ul>
    </div>
  </nav>

  <!-- Login Form Section -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <span style="font-size: 2.2rem;">🔐</span>
        <h2 id="loginTitle">Resident Sign In</h2>
        <p id="loginSubtitle">Access your maintenance dashboard and track complaints</p>
      </div>

      <!-- Role Selector Tabs -->
      <div class="role-tabs">
        <button type="button" class="role-tab active" id="tabStudent" onclick="switchRole('student')">Student</button>
        <button type="button" class="role-tab" id="tabStaff" onclick="switchRole('staff')">Staff / Warden</button>
      </div>

      <!-- Sign In Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="your.name@hostel.edu" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In to Portal
        </button>
      </form>

      <div class="auth-footer" id="registerPrompt">
        Don't have an account yet? <a href="/register.html">Register as Student</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    let activeRole = 'student';

    // Check URL parameters for preset role tab (e.g. login.html?role=staff)
    document.addEventListener('DOMContentLoaded', () => {
      // If user is already logged in, redirect them
      const user = getUser();
      if (user) {
        if (user.role === 'student') window.location.href = '/student-dashboard.html';
        else window.location.href = '/staff-dashboard.html';
        return;
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get('role') === 'staff') {
        switchRole('staff');
      }
    });

    function switchRole(role) {
      activeRole = role;
      const tabStudent = document.getElementById('tabStudent');
      const tabStaff = document.getElementById('tabStaff');
      const title = document.getElementById('loginTitle');
      const subtitle = document.getElementById('loginSubtitle');
      const registerPrompt = document.getElementById('registerPrompt');

      if (role === 'staff') {
        tabStudent.classList.remove('active');
        tabStaff.classList.add('active');
        title.innerText = 'Staff & Warden Sign In';
        subtitle.innerText = 'Triage complaints, assign technicians, and view analytics';
        registerPrompt.style.display = 'none';
      } else {
        tabStaff.classList.remove('active');
        tabStudent.classList.add('active');
        title.innerText = 'Resident Sign In';
        subtitle.innerText = 'Access your maintenance dashboard and track complaints';
        registerPrompt.style.display = 'block';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Signing in...';

      const response = await apiRequest('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });

      submitBtn.disabled = false;
      submitBtn.innerText = 'Sign In to Portal';

      if (!response.success) {
        showToast(response.error || 'Invalid credentials. Please try again.', 'error');
        return;
      }

      const user = response.data.user;
      const token = response.data.token;

      // Save user session
      setSession(user, token);
      showToast(response.message || `Welcome, ${user.name}!`, 'success');

      // Redirect according to user role
      setTimeout(() => {
        if (user.role === 'student') {
          window.location.href = '/student-dashboard.html';
        } else {
          window.location.href = '/staff-dashboard.html';
        }
      }, 700);
    }
  </script>
</body>
</html>
